name: realibre
description: >-
  RealiBre (LibreMe) — an open-source, telemetry-free companion app and custom
  pairer for the Realme Buds T310. Replaces the stock Realme Link app for this
  device with something fully local and auditable.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Pinned (not caret): 1.8+ requires AGP newer than this project's 8.1.
  dynamic_color: 1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
